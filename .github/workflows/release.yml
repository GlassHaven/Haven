name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# Shared by both jobs.
env:
  # Force any JS action still declaring node20 onto Node.js 24 (GitHub
  # deprecated node20 runners 2026-06-02). All pinned actions are node24-native
  # as of the v7/v8/v3 bumps; kept as a safety net for future additions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least-privilege floor. verify-ci/test/build only read; publish raises its
# own block for the release upload + provenance.
permissions:
  contents: read

jobs:
  # Skip a full ~16 min unit-test re-run when CI has already
  # verified the tagged commit on main — same commit, same test invocation
  # would produce the same result. Falls through to a real test run if
  # CI hasn't reported yet (rare: tag created without a prior main push)
  # or reported anything other than success.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci-passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Check CI status on tagged commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ask the CI workflow directly whether it passed on THIS commit.
          #
          # Do NOT use /commits/{sha}/status: that endpoint aggregates the legacy
          # Statuses API, and GitHub Actions publishes *check runs*, not statuses.
          # This repo has zero statuses, so it answered "pending" for every commit
          # ever tagged — meaning this job never once skipped the test re-run it
          # exists to skip, and every release paid ~16 minutes for nothing.
          #
          # /commits/{sha}/check-runs is the check-run equivalent but includes this
          # very workflow's own in-flight runs, so it can never be all-green either.
          # Filtering the CI workflow's completed runs by head_sha asks exactly the
          # question we mean: "did CI pass on this commit?"
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '.workflow_runs[0].conclusion // "none"' 2>/dev/null || echo "unknown")
          echo "CI conclusion for ${GITHUB_SHA:0:7}: ${conclusion}"
          if [ "$conclusion" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            # Fail safe: anything else (no CI run yet, failure, API trouble) runs
            # the tests for real rather than shipping on an unverified commit.
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  # Unit tests run once — flavor-agnostic, not worth duplicating per ABI.
  # Skipped entirely when CI already reported success for this SHA.
  # Runs on the free 4-core runner; larger runners are paid-tier and were
  # silently queueing release builds once that budget was exhausted.
  test:
    needs: verify-ci
    if: needs.verify-ci.outputs.ci-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
      # Unit tests don't compile the Wayland native build, so we skip
      # `wayland-android` entirely — its freedesktop submodule chain
      # (cairo, mesa-drm, fontconfig, libinput) goes through
      # gitlab.freedesktop.org which intermittently 5xxs and breaks
      # this job for non-test reasons. The build job below still does
      # the full recursive init.
      - uses: ./.github/actions/init-submodules-with-retry
        with:
          paths: |
            termlib
            mosh-kotlin
            et-kotlin
            spice-kotlin
            reticulum-kt
            rnsh-kt
            build-proot/proot-termux
      - uses: ./.github/actions/setup-toolchain
      - name: Run release unit tests
        # Same gating set as ci.yml: name :app:testArm64FullDebugUnitTest
        # explicitly because :app uses ABI+features product flavors (bare
        # testDebugUnitTest matches no :app task). The sshlib contract tests
        # are back in the gating set (#58) — the CHANNEL_CLOSE race (#448) is
        # fixed upstream and the suite passes on a fixed sshlib pin.
        run: >-
          ./gradlew testDebugUnitTest :app:testArm64FullDebugUnitTest
          -PskipWaylandNatives=true
          -PskipFfmpegNatives=true
          -PskipUml=true
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

  # arm64 builds immediately on tag — the dominant ABI (~80% of downloads).
  # armv7/x64 are filled nightly by release-nightly.yml for the latest tag,
  # so the common-case publish is not hostage to rare-ABI flakes and fewer
  # parallel jobs run per release. The per-ABI build (full APK+AAB, terminal
  # APK, storage APK, with the daemon-restart memory pattern) lives in
  # build-release-abi.yml, shared with the nightly workflow.
  build:
    needs: [verify-ci, test]
    if: |
      !cancelled() &&
      (needs.verify-ci.outputs.ci-passed == 'true' || needs.test.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64, variant: Arm64 }
    uses: ./.github/workflows/build-release-abi.yml
    with:
      abi: ${{ matrix.abi }}
      variant: ${{ matrix.variant }}
    secrets: inherit

  # Aggregate both ABIs onto a single GitHub release. Splitting this from
  # build lets the per-ABI jobs run in parallel while the release step
  # still sees every artifact.
  publish:
    needs: build
    # Must name a status function explicitly. With a bare `if: startsWith(...)`,
    # GitHub applies an implicit success() over the whole dependency GRAPH — and
    # once verify-ci greenlights the SHA, `test` is skipped, which makes that
    # implicit success() false and silently skips publish (nothing ships). `build`
    # already guards itself this way; publish must too. This path only became
    # reachable when verify-ci started skipping `test` for the first time.
    if: |
      !cancelled() && needs.build.result == 'success' &&
      startsWith(github.ref, 'refs/tags/')
    # Publish is just artifact download + GitHub Release upload — no heavy
    # compile work. Keep on the free 4-core runner to avoid spending larger-
    # runner minutes on ~20 seconds of I/O.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reviewer-gated: the `signing` Environment (configured in repo settings
    # with a required reviewer + v*/main restriction) must approve before the
    # release is published, so no single account can ship unilaterally.
    environment: signing
    permissions:
      contents: write        # create the GitHub Release + upload assets
      id-token: write         # OIDC for build-provenance attestation
      attestations: write     # write the provenance attestation
    steps:
      # First — checkout runs `git clean`, so it must precede the artifact
      # downloads or it would wipe release/. Provides CHANGELOG.md + the
      # extractor script (each job runs on a fresh runner).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
      - name: Download arm64 artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: haven-arm64-release
          path: release/
      # armv7/x64 assets are appended nightly by release-nightly.yml; this
      # publish ships the arm64 assets immediately.
      # Cryptographically tie each binary to this repo + commit + workflow so
      # downstreams (F-Droid, users) can verify provenance with `gh attestation
      # verify <file> --repo GlassHaven/Haven`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            release/**/*.apk
            release/**/*.aab
      # Publish a flat checksum manifest alongside the assets (asset names are
      # basenames once on the release, so the manifest uses basenames too).
      - name: Generate SHA256SUMS
        run: |
          : > SHA256SUMS
          find release -type f \( -name '*.apk' -o -name '*.aab' \) | sort | while read -r f; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> SHA256SUMS
          done
          cat SHA256SUMS
      # The notes for this tag must already exist in CHANGELOG.md (CI lint
      # enforces it at version-bump time). Extract that section as the release
      # body; generate_release_notes still appends the "Full Changelog" link.
      - name: Extract release notes from CHANGELOG.md
        run: ./scripts/check-changelog.sh extract "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
      # #514: someone asked what the "terminal" APKs are, which means the release
      # page was not answering it. Appended to every release rather than left to
      # a changelog entry nobody scrolls back to, or an issue nobody finds.
      - name: Append the which-APK guide
        run: |
          cat >> RELEASE_NOTES.md <<'GUIDE'

          ---

          ### Which APK?

          **`haven-<version>-<abi>-release.apk`** — the full app, and what F-Droid
          carries. If in doubt, take this one.

          **`haven-<version>-<abi>-terminal-release.apk`** — the same app with the
          desktop, media and rclone cloud-storage parts left out, for people who
          only use Haven for SSH, terminals and SFTP files. The smallest build.
          It drops RDP and SPICE remote desktop, the native Wayland desktop,
          ffmpeg (no media conversion or video previews/streaming) and rclone
          (no Filen/Mega/Google Drive cloud storage). VNC is kept, so a Linux
          desktop running inside Haven's guest still works.

          **`haven-<version>-<abi>-storage-release.apk`** — the terminal build plus
          rclone cloud storage (Filen, Mega, Google Drive and the other rclone
          remotes), still without the desktop and media parts. For people who want
          remote storage in a small app without the full desktop payload.

          All three are signed with the same key and carry the same version number,
          so you can install any over another without losing connections, keys or
          your Linux guest. The shared version number does mean an updater will not
          offer to move you between them — switching is a deliberate download.

          `<abi>` is your device's CPU: `arm64` for essentially every modern phone,
          `armv7` for older 32-bit devices, `x64` for emulators.

          The `arm64` assets ship immediately with each release. The `armv7` and
          `x64` assets are built nightly for the latest release and added here
          within a day, so those rare-ABI downloads may appear slightly later.
          GUIDE
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            release/**/*.apk
            release/**/*.aab
            SHA256SUMS
